<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 724" width="1120" height="724" role="img" aria-labelledby="base-buzzer-r4-title base-buzzer-r4-desc">
  <title id="base-buzzer-r4-title">Base-station buzzer on an Uno R4</title>
  <desc id="base-buzzer-r4-desc">On an Uno R4 the buzzer uses an NPN transistor: D8 through 1 kilohm to the base, the buzzer between 5V and the collector, and the emitter to GND.</desc>
  <defs>
    <marker id="base-buzzer-r4-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="base-buzzer-r4-arrow-back" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="#4f5d75"/>
    </marker>
    <marker id="base-buzzer-r4-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="base-buzzer-r4-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text x="48" y="44" fill="#7a8399" font-size="13" font-family="'Liberation Mono', 'Courier New', Courier, monospace" letter-spacing="0.14em">STEADY  ·  WIRING</text>
  <text x="48" y="96" fill="#2d3142" font-size="36" font-family="'Noto Serif', Georgia, 'Times New Roman', serif">Base-station buzzer on an Uno R4</text>
  <text x="48" y="138" fill="#4f5d75" font-size="16" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">All three lines are one circuit. A buzzer can draw more than a pin allows, so</text>
  <text x="48" y="164" fill="#4f5d75" font-size="16" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">the R4 drives it through the transistor.</text>
  <text x="168" y="216" fill="#7a8399" font-size="13" font-family="'Liberation Mono', 'Courier New', Courier, monospace" text-anchor="middle" letter-spacing="0.12em">FROM</text>
  <text x="560" y="216" fill="#7a8399" font-size="13" font-family="'Liberation Mono', 'Courier New', Courier, monospace" text-anchor="middle" letter-spacing="0.12em">PART</text>
  <text x="952" y="216" fill="#7a8399" font-size="13" font-family="'Liberation Mono', 'Courier New', Courier, monospace" text-anchor="middle" letter-spacing="0.12em">TO</text>
  <line x1="288" y1="272" x2="440" y2="272" fill="none" stroke="#4f5d75" stroke-width="2"/>
  <line x1="680" y1="272" x2="832" y2="272" fill="none" stroke="#4f5d75" stroke-width="2"/>
  <rect x="48" y="238" width="240" height="68" rx="6" fill="#f5f5f5"/>
  <rect x="48" y="238" width="240" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.25"/>
  <text x="168.0" y="278" fill="#2d3142" font-size="20" font-weight="600" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">D8</text>
  <rect x="440" y="238" width="240" height="68" rx="6" fill="#f5f5f5"/>
  <rect x="440" y="238" width="240" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.25"/>
  <text x="560.0" y="278" fill="#2d3142" font-size="20" font-weight="600" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">1 kΩ</text>
  <rect x="832" y="238" width="240" height="68" rx="6" fill="#f5f5f5"/>
  <rect x="832" y="238" width="240" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.25"/>
  <text x="952.0" y="268" fill="#2d3142" font-size="20" font-weight="600" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Base</text>
  <text x="952.0" y="290" fill="#4f5d75" font-size="13" font-family="'Liberation Mono', 'Courier New', Courier, monospace" text-anchor="middle">NPN transistor</text>
  <line x1="288" y1="372" x2="440" y2="372" fill="none" stroke="#4f5d75" stroke-width="2"/>
  <line x1="680" y1="372" x2="832" y2="372" fill="none" stroke="#4f5d75" stroke-width="2"/>
  <rect x="48" y="338" width="240" height="68" rx="6" fill="#f5f5f5"/>
  <rect x="48" y="338" width="240" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.25"/>
  <text x="168.0" y="378" fill="#2d3142" font-size="20" font-weight="600" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">5V</text>
  <rect x="440" y="338" width="240" height="68" rx="6" fill="#f5f5f5"/>
  <rect x="440" y="338" width="240" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.25"/>
  <text x="560.0" y="368" fill="#2d3142" font-size="20" font-weight="600" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Buzzer</text>
  <text x="560.0" y="390" fill="#4f5d75" font-size="13" font-family="'Liberation Mono', 'Courier New', Courier, monospace" text-anchor="middle">Passive</text>
  <rect x="832" y="338" width="240" height="68" rx="6" fill="#f5f5f5"/>
  <rect x="832" y="338" width="240" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.25"/>
  <text x="952.0" y="368" fill="#2d3142" font-size="20" font-weight="600" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Collector</text>
  <text x="952.0" y="390" fill="#4f5d75" font-size="13" font-family="'Liberation Mono', 'Courier New', Courier, monospace" text-anchor="middle">NPN transistor</text>
  <line x1="288" y1="472" x2="832" y2="472" fill="none" stroke="#4f5d75" stroke-width="2"/>
  <rect x="522.5" y="438" width="75" height="22" rx="2" fill="#f5f5f5"/>
  <text x="560.0" y="454" fill="#7a8399" font-size="15" font-family="'Liberation Mono', 'Courier New', Courier, monospace" text-anchor="middle">DIRECT</text>
  <rect x="48" y="438" width="240" height="68" rx="6" fill="#f5f5f5"/>
  <rect x="48" y="438" width="240" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.25"/>
  <text x="168.0" y="468" fill="#2d3142" font-size="20" font-weight="600" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Emitter</text>
  <text x="168.0" y="490" fill="#4f5d75" font-size="13" font-family="'Liberation Mono', 'Courier New', Courier, monospace" text-anchor="middle">NPN transistor</text>
  <rect x="832" y="438" width="240" height="68" rx="6" fill="#f5f5f5"/>
  <rect x="832" y="438" width="240" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.25"/>
  <text x="952.0" y="478" fill="#2d3142" font-size="20" font-weight="600" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">GND</text>
  <text x="48" y="546" fill="#4f5d75" font-size="16" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">This is the Uno R4 path only. A classic Nano or Uno R3 can wire a small piezo straight from</text>
  <text x="48" y="572" fill="#4f5d75" font-size="16" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">D8 to GND.</text>
  <line x1="48" y1="622" x2="1072" y2="622" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <text x="48" y="654" fill="#7a8399" font-size="13" font-family="'Liberation Mono', 'Courier New', Courier, monospace" letter-spacing="0.14em">LEGEND</text>
  <line x1="160" y1="650" x2="196" y2="650" stroke="#4f5d75" stroke-width="2"/>
  <text x="206" y="654" fill="#4f5d75" font-size="14" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">One wire in this circuit</text>
</svg>
