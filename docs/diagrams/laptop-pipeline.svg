<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 608" width="1280" height="608" role="img" aria-labelledby="laptop-pipeline-title laptop-pipeline-desc">
  <title id="laptop-pipeline-title">Inside the laptop: checkin serve</title>
  <desc id="laptop-pipeline-desc">The motion source feeds the session controller, then signals.py, steadi.py, and the saved files. The controller and steadi.py both update FastAPI.</desc>
  <defs>
    <marker id="laptop-pipeline-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="laptop-pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="laptop-pipeline-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text x="48" y="48" fill="#7a8399" font-size="13" font-family="'Liberation Mono', 'Courier New', Courier, monospace" letter-spacing="0.14em">STEADY  ·  LAPTOP</text>
  <text x="48" y="100" fill="#2d3142" font-size="36" font-family="'Noto Serif', Georgia, 'Times New Roman', serif">Inside the laptop: checkin serve</text>
  <text x="48" y="142" fill="#4f5d75" font-size="16" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">One path. The controller runs the session. signals.py scores the step. steadi.py flags it.</text>
  <line x1="244" y1="250" x2="292" y2="250" stroke="#4f5d75" stroke-width="2" marker-end="url(#laptop-pipeline-arrow)"/>
  <line x1="492" y1="250" x2="540" y2="250" stroke="#4f5d75" stroke-width="2" marker-end="url(#laptop-pipeline-arrow)"/>
  <line x1="740" y1="250" x2="788" y2="250" stroke="#4f5d75" stroke-width="2" marker-end="url(#laptop-pipeline-arrow)"/>
  <line x1="988" y1="250" x2="1036" y2="250" stroke="#4f5d75" stroke-width="2" marker-end="url(#laptop-pipeline-arrow)"/>
  <path d="M 392,304 V 440 Q 392,448 400,448 H 520" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#laptop-pipeline-arrow)"/>
  <path d="M 888,304 V 440 Q 888,448 880,448 H 760" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#laptop-pipeline-arrow)"/>
  <rect x="44" y="196" width="200" height="108" rx="6" fill="#f5f5f5"/>
  <rect x="44" y="196" width="200" height="108" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.25"/>
  <text x="144.0" y="232" fill="#2d3142" font-size="16" font-weight="600" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Motion source</text>
  <text x="144.0" y="258" fill="#4f5d75" font-size="13" font-family="'Liberation Mono', 'Courier New', Courier, monospace" text-anchor="middle">interface</text>
  <rect x="292" y="196" width="200" height="108" rx="6" fill="#f5f5f5"/>
  <rect x="292" y="196" width="200" height="108" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.5"/>
  <text x="392.0" y="232" fill="#2d3142" font-size="16" font-weight="600" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Session controller</text>
  <text x="392.0" y="258" fill="#4f5d75" font-size="13" font-family="'Liberation Mono', 'Courier New', Courier, monospace" text-anchor="middle">cues each step,</text>
  <text x="392.0" y="276" fill="#4f5d75" font-size="13" font-family="'Liberation Mono', 'Courier New', Courier, monospace" text-anchor="middle">tags the stream</text>
  <rect x="540" y="196" width="200" height="108" rx="6" fill="#f5f5f5"/>
  <rect x="540" y="196" width="200" height="108" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.25"/>
  <text x="640.0" y="232" fill="#2d3142" font-size="16" font-weight="600" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">signals.py</text>
  <text x="640.0" y="258" fill="#4f5d75" font-size="13" font-family="'Liberation Mono', 'Courier New', Courier, monospace" text-anchor="middle">TUG time, stands,</text>
  <text x="640.0" y="276" fill="#4f5d75" font-size="13" font-family="'Liberation Mono', 'Courier New', Courier, monospace" text-anchor="middle">holds, sway</text>
  <rect x="788" y="196" width="200" height="108" rx="6" fill="#f5f5f5"/>
  <rect x="788" y="196" width="200" height="108" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.25"/>
  <text x="888.0" y="232" fill="#2d3142" font-size="16" font-weight="600" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">steadi.py</text>
  <text x="888.0" y="258" fill="#4f5d75" font-size="13" font-family="'Liberation Mono', 'Courier New', Courier, monospace" text-anchor="middle">flags, baseline,</text>
  <text x="888.0" y="276" fill="#4f5d75" font-size="13" font-family="'Liberation Mono', 'Courier New', Courier, monospace" text-anchor="middle">level, exercise plan</text>
  <rect x="1036" y="196" width="200" height="108" rx="6" fill="#f5f5f5"/>
  <rect x="1036" y="196" width="200" height="108" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1.25"/>
  <text x="1136.0" y="232" fill="#2d3142" font-size="16" font-weight="600" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">data/</text>
  <text x="1136.0" y="258" fill="#4f5d75" font-size="13" font-family="'Liberation Mono', 'Courier New', Courier, monospace" text-anchor="middle">people JSON,</text>
  <text x="1136.0" y="276" fill="#4f5d75" font-size="13" font-family="'Liberation Mono', 'Courier New', Courier, monospace" text-anchor="middle">raw CSV recordings</text>
  <rect x="520" y="400" width="240" height="96" rx="6" fill="#f5f5f5"/>
  <rect x="520" y="400" width="240" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.25"/>
  <text x="640.0" y="436" fill="#2d3142" font-size="16" font-weight="600" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">FastAPI</text>
  <text x="640.0" y="462" fill="#4f5d75" font-size="13" font-family="'Liberation Mono', 'Courier New', Courier, monospace" text-anchor="middle">REST + WebSocket + static page</text>
  <line x1="48" y1="544" x2="1232" y2="544" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <text x="48" y="576" fill="#7a8399" font-size="13" font-family="'Liberation Mono', 'Courier New', Courier, monospace" letter-spacing="0.14em">LEGEND</text>
  <line x1="160" y1="572" x2="196" y2="572" stroke="#4f5d75" stroke-width="2" marker-end="url(#laptop-pipeline-arrow)"/>
  <text x="208" y="576" fill="#4f5d75" font-size="14" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Hands off to the next step</text>
  <rect x="470" y="560" width="28" height="16" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.5"/>
  <text x="508" y="576" fill="#4f5d75" font-size="14" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Session controller</text>
  <rect x="720" y="560" width="28" height="16" rx="3" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1.25"/>
  <text x="758" y="576" fill="#4f5d75" font-size="14" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Saved files</text>
</svg>
