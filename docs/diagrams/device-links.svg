  <title id="device-links-title">How the devices connect</title>
  <desc id="device-links-desc">Each line is one link: I2C from the MPU-6050 to the ESP32, UDP motion to the laptop and LED colour back, phone HTTP, the simulator and a CSV replay, USB serial to the Arduino, the on-screen base, the tablet on the local network, and an optional Grok summary.</desc>
