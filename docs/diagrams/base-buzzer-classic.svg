<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 472" width="1120" height="472" role="img" aria-labelledby="base-buzzer-classic-title base-buzzer-classic-desc">
  <title id="base-buzzer-classic-title">Base-station buzzer on a classic Nano or Uno R3</title>
  <desc id="base-buzzer-classic-desc">On a classic Nano or Uno R3, a small piezo buzzer connects from D8 to GND with no transistor.</desc>
  <defs>
    <marker id="base-buzzer-classic-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="base-buzzer-classic-arrow-back" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="#4f5d75"/>
    </marker>
    <marker id="base-buzzer-classic-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="base-buzzer-classic-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text x="48" y="44" fill="#7a8399" font-size="13" font-family="'Liberation Mono', 'Courier New', Courier, monospace" letter-spacing="0.14em">STEADY  ·  WIRING</text>
  <text x="48" y="96" fill="#2d3142" font-size="36" font-family="'Noto Serif', Georgia, 'Times New Roman', serif">Base-station buzzer on a classic Nano or Uno R3</text>
  <text x="48" y="138" fill="#4f5d75" font-size="16" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">One wire. Use this instead of the transistor circuit, not in addition to it.</text>
  <line x1="288" y1="222" x2="440" y2="222" fill="none" stroke="#4f5d75" stroke-width="2"/>
  <line x1="680" y1="222" x2="832" y2="222" fill="none" stroke="#4f5d75" stroke-width="2"/>
  <rect x="48" y="188" width="240" height="68" rx="6" fill="#f5f5f5"/>
  <rect x="48" y="188" width="240" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.25"/>
  <text x="168.0" y="228" fill="#2d3142" font-size="20" font-weight="600" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">D8</text>
  <rect x="440" y="188" width="240" height="68" rx="6" fill="#f5f5f5"/>
  <rect x="440" y="188" width="240" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.25"/>
  <text x="560.0" y="218" fill="#2d3142" font-size="20" font-weight="600" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Buzzer</text>
  <text x="560.0" y="240" fill="#4f5d75" font-size="13" font-family="'Liberation Mono', 'Courier New', Courier, monospace" text-anchor="middle">Small piezo</text>
  <rect x="832" y="188" width="240" height="68" rx="6" fill="#f5f5f5"/>
  <rect x="832" y="188" width="240" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.25"/>
  <text x="952.0" y="228" fill="#2d3142" font-size="20" font-weight="600" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">GND</text>
  <text x="48" y="296" fill="#4f5d75" font-size="16" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">tone() on these boards disables PWM on D3 and D11. That is why the LED stays on D5, D6, and</text>
  <text x="48" y="322" fill="#4f5d75" font-size="16" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">D9.</text>
  <line x1="48" y1="372" x2="1072" y2="372" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <text x="48" y="404" fill="#7a8399" font-size="13" font-family="'Liberation Mono', 'Courier New', Courier, monospace" letter-spacing="0.14em">LEGEND</text>
  <line x1="160" y1="400" x2="196" y2="400" stroke="#4f5d75" stroke-width="2"/>
  <text x="206" y="404" fill="#4f5d75" font-size="14" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">One wire</text>
</svg>
