<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 940" width="1120" height="940" role="img" aria-labelledby="belt-power-title belt-power-desc">
  <title id="belt-power-title">How the ESP32 belt is powered</title>
  <desc id="belt-power-desc">Primary power is a USB power bank into the ESP32 USB port. Backup is four AAA cells into VIN and GND, never at the same time as USB, and never into the 3V3 pin.</desc>
  <defs>
    <marker id="belt-power-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="belt-power-arrow-back" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="#4f5d75"/>
    </marker>
    <marker id="belt-power-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="belt-power-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text x="48" y="44" fill="#7a8399" font-size="13" font-family="'Liberation Mono', 'Courier New', Courier, monospace" letter-spacing="0.14em">STEADI  ·  WIRING</text>
  <text x="48" y="96" fill="#2d3142" font-size="36" font-family="'Noto Serif', Georgia, 'Times New Roman', serif">How the ESP32 belt is powered</text>
  <text x="48" y="138" fill="#4f5d75" font-size="16" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">The MPU-6050 takes 3.3 V from the ESP32 3V3 pin, shown in the sensor wiring.</text>
  <text x="48" y="200" fill="#7a8399" font-size="13" font-family="'Liberation Mono', 'Courier New', Courier, monospace" letter-spacing="0.14em">PRIMARY</text>
  <line x1="348" y1="266" x2="772" y2="266" fill="none" stroke="#4f5d75" stroke-width="2"/>
  <rect x="48" y="232" width="300" height="68" rx="6" fill="#f5f5f5"/>
  <rect x="48" y="232" width="300" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.25"/>
  <text x="198.0" y="262" fill="#2d3142" font-size="20" font-weight="600" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">USB power bank</text>
  <text x="198.0" y="284" fill="#4f5d75" font-size="13" font-family="'Liberation Mono', 'Courier New', Courier, monospace" text-anchor="middle">5 V in</text>
  <rect x="772" y="232" width="300" height="68" rx="6" fill="#f5f5f5"/>
  <rect x="772" y="232" width="300" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.25"/>
  <text x="922.0" y="262" fill="#2d3142" font-size="20" font-weight="600" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">ESP32 USB port</text>
  <text x="922.0" y="284" fill="#4f5d75" font-size="13" font-family="'Liberation Mono', 'Courier New', Courier, monospace" text-anchor="middle">On-board regulator</text>
  <text x="48" y="356" fill="#7a8399" font-size="13" font-family="'Liberation Mono', 'Courier New', Courier, monospace" letter-spacing="0.14em">BACKUP, NOT AT THE SAME TIME</text>
  <line x1="348" y1="422" x2="772" y2="422" fill="none" stroke="#4f5d75" stroke-width="2" stroke-dasharray="6,5"/>
  <rect x="48" y="388" width="300" height="68" rx="6" fill="#f5f5f5"/>
  <rect x="48" y="388" width="300" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.25"/>
  <text x="198.0" y="418" fill="#2d3142" font-size="20" font-weight="600" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">4× AAA holder</text>
  <text x="198.0" y="440" fill="#4f5d75" font-size="13" font-family="'Liberation Mono', 'Courier New', Courier, monospace" text-anchor="middle">About 6 V, not 3 cells</text>
  <rect x="772" y="388" width="300" height="68" rx="6" fill="#f5f5f5"/>
  <rect x="772" y="388" width="300" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.25"/>
  <text x="922.0" y="428" fill="#2d3142" font-size="20" font-weight="600" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">VIN or 5V</text>
  <line x1="348" y1="522" x2="772" y2="522" fill="none" stroke="#4f5d75" stroke-width="2" stroke-dasharray="6,5"/>
  <rect x="48" y="488" width="300" height="68" rx="6" fill="#f5f5f5"/>
  <rect x="48" y="488" width="300" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.25"/>
  <text x="198.0" y="518" fill="#2d3142" font-size="20" font-weight="600" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">4× AAA holder</text>
  <text x="198.0" y="540" fill="#4f5d75" font-size="13" font-family="'Liberation Mono', 'Courier New', Courier, monospace" text-anchor="middle">Other lead</text>
  <rect x="772" y="488" width="300" height="68" rx="6" fill="#f5f5f5"/>
  <rect x="772" y="488" width="300" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.25"/>
  <text x="922.0" y="528" fill="#2d3142" font-size="20" font-weight="600" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">GND</text>
  <rect x="48" y="588" width="1024" height="80" rx="6" fill="#f5f5f5"/>
  <rect x="48" y="588" width="1024" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.5"/>
  <text x="72" y="620" fill="#2d3142" font-size="18" font-weight="600" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Do not connect batteries to the 3V3 pin.</text>
  <text x="72" y="648" fill="#2d3142" font-size="18" font-weight="600" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Do not power from USB and VIN at the same time.</text>
  <text x="48" y="704" fill="#4f5d75" font-size="16" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Four fresh cells are about 6 V, which the regulator can take. Three cells sag too low and</text>
  <text x="48" y="730" fill="#4f5d75" font-size="16" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">the board resets when Wi-Fi transmits.</text>
  <text x="48" y="764" fill="#4f5d75" font-size="16" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Weak power shows up as “Brownout detector was triggered” in the serial monitor. Use the</text>
  <text x="48" y="790" fill="#4f5d75" font-size="16" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">power bank and a short cable.</text>
  <line x1="48" y1="840" x2="1072" y2="840" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <text x="48" y="872" fill="#7a8399" font-size="13" font-family="'Liberation Mono', 'Courier New', Courier, monospace" letter-spacing="0.14em">LEGEND</text>
  <line x1="160" y1="868" x2="196" y2="868" stroke="#4f5d75" stroke-width="2"/>
  <text x="206" y="872" fill="#4f5d75" font-size="14" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Use this</text>
  <line x1="298" y1="868" x2="334" y2="868" stroke="#4f5d75" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="344" y="872" fill="#4f5d75" font-size="14" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Backup only, USB unplugged</text>
  <rect x="580" y="858" width="28" height="16" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.5"/>
  <text x="626" y="872" fill="#4f5d75" font-size="14" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">Do not do this</text>
</svg>
