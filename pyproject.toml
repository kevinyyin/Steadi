[project]
name = "checkin"
version = "0.1.0"
description = "STEADI fall-risk screening check-in: belt, base station, family dashboard"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "numpy>=1.26",
    "pyserial>=3.5",
    "resvg-py>=0.5.0",
    "uvicorn>=0.30",
    "websockets>=13",
]

[project.scripts]
checkin = "checkin.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
